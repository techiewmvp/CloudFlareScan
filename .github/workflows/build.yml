name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build exe
        shell: pwsh
        run: |
          $opts = @("--noconfirm","--clean","--onefile","--windowed","--name","CloudFlareScan")
          if (Test-Path cfs.ico) { $opts += @("--icon","cfs.ico","--add-data","cfs.ico;.") }
          python -m PyInstaller @opts cloudflare_scan.py
          Copy-Item LICENSE dist\LICENSE
          Compress-Archive -Path dist\CloudFlareScan.exe, dist\LICENSE -DestinationPath CloudFlareScan-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-windows
          path: CloudFlareScan-windows.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CloudFlareScan-windows.zip
